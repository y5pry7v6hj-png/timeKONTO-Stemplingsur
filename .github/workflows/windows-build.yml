name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore

      - name: Publish Windows x64
        run: dotnet publish Stemplingsur.csproj -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o publish-windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: timeKONTO-Stemplingsur-Windows-x64
          path: publish-windows/
          if-no-files-found: error
