name: Windows MSIX

on:
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Restore
        shell: pwsh
        run: dotnet restore Stemplingsur.csproj

      - name: Create temporary signing certificate
        id: cert
        shell: pwsh
        run: |
          $certDir = Join-Path $env:RUNNER_TEMP 'timekonto-cert'
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null

          $password = [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
          $secure = ConvertTo-SecureString -String $password -Force -AsPlainText

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=timeKONTO Stemplingsur' `
            -KeyUsage DigitalSignature `
            -FriendlyName 'timeKONTO Stemplingsur' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.19={text}false','2.5.29.37={text}1.3.6.1.5.5.7.3.3')

          $pfx = Join-Path $certDir 'timeKONTO-Stemplingsur.pfx'
          $cer = Join-Path $certDir 'timeKONTO-Stemplingsur.cer'

          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null

          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "cer=$cer" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Publish signed MSIX x64
        shell: pwsh
        run: |
          dotnet publish Stemplingsur.csproj `
            -f net10.0-windows10.0.19041.0 `
            -c Release `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="${{ steps.cert.outputs.pfx }}" `
            -p:PackageCertificatePassword="${{ steps.cert.outputs.password }}" `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly

      - name: Collect install files
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'timeKONTO-MSIX'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $msix = Get-ChildItem -Path . -Recurse -Filter *.msix |
            Where-Object { $_.FullName -match 'AppPackages' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $msix) {
            throw 'Fant ingen MSIX-fil under AppPackages etter publish.'
          }

          Copy-Item $msix.FullName (Join-Path $out 'timeKONTO-Stemplingsur-x64.msix')
          Copy-Item "${{ steps.cert.outputs.cer }}" (Join-Path $out 'timeKONTO-Stemplingsur.cer')

          @'
          timeKONTO Stemplingsur - Windows

          1. Installer timeKONTO-Stemplingsur.cer i sertifikatlageret "Trusted People" på maskinen.
          2. Dobbeltklikk timeKONTO-Stemplingsur-x64.msix og velg Installer.

          Sertifikatet er selvsignert og laget for intern installasjon/testing.
          '@ | Set-Content -Path (Join-Path $out 'INSTALLER.txt') -Encoding UTF8

      - name: Upload MSIX installer
        uses: actions/upload-artifact@v4
        with:
          name: timeKONTO-Stemplingsur-Windows-MSIX
          path: ${{ runner.temp }}\timeKONTO-MSIX\*
          if-no-files-found: error
