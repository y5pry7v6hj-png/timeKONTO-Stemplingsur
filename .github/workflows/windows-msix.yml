name: Windows MSIX

on:
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Restore
        shell: pwsh
        run: dotnet restore Stemplingsur.csproj

      - name: Create code-signing certificate
        id: cert
        shell: pwsh
        run: |
          $certDir = Join-Path $env:RUNNER_TEMP 'timekonto-cert'
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null

          # Publisher MUST exactly match Package.appxmanifest: Publisher="CN=timeKONTO"
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=timeKONTO' `
            -FriendlyName 'timeKONTO Stemplingsur MSIX' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -KeyExportPolicy Exportable `
            -KeySpec Signature `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(3)

          if (-not $cert) {
            throw 'Kunne ikke opprette kode-signeringsertifikat.'
          }

          $cer = Join-Path $certDir 'timeKONTO-Stemplingsur.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null

          Write-Host "Certificate subject: $($cert.Subject)"
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"
          Write-Host "Enhanced Key Usage: $($cert.EnhancedKeyUsageList | ForEach-Object FriendlyName)"

          "cer=$cer" >> $env:GITHUB_OUTPUT
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Publish signed MSIX x64
        shell: pwsh
        run: |
          dotnet publish Stemplingsur.csproj `
            -f net10.0-windows10.0.19041.0 `
            -c Release `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="${{ steps.cert.outputs.thumbprint }}" `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly

      - name: Collect install files
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'timeKONTO-MSIX'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $msix = Get-ChildItem -Path . -Recurse -Filter *.msix |
            Where-Object { $_.FullName -match 'AppPackages' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $msix) {
            throw 'Fant ingen MSIX-fil under AppPackages etter publish.'
          }

          Copy-Item $msix.FullName (Join-Path $out 'timeKONTO-Stemplingsur-x64.msix')
          Copy-Item "${{ steps.cert.outputs.cer }}" (Join-Path $out 'timeKONTO-Stemplingsur.cer')

          @'
          timeKONTO Stemplingsur - Windows

          Første installasjon på en Windows-maskin:
          1. Dobbeltklikk timeKONTO-Stemplingsur.cer.
          2. Velg Installer sertifikat.
          3. Velg Lokal maskin hvis du har administratorrettigheter, ellers Gjeldende bruker.
          4. Velg Plasser alle sertifikater i følgende lager.
          5. Velg Klarerte personer (Trusted People).
          6. Fullfør sertifikatinstallasjonen.
          7. Dobbeltklikk timeKONTO-Stemplingsur-x64.msix og velg Installer.

          Sertifikatet er selvsignert og laget for intern installasjon/testing.
          '@ | Set-Content -Path (Join-Path $out 'INSTALLER.txt') -Encoding UTF8

      - name: Upload MSIX installer
        uses: actions/upload-artifact@v6
        with:
          name: timeKONTO-Stemplingsur-Windows-MSIX
          path: ${{ runner.temp }}\timeKONTO-MSIX\*
          if-no-files-found: error
